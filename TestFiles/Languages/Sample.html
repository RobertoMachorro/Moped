<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Sample.html — exercises Moped's HTML tokenizer</title>
	<style>
		body { font-family: sans-serif; }
	</style>
</head>
<body>
	<header>
		<h1>Welcome to Moped</h1>
	</header>
	<main>
		<p>This is a <strong>sample</strong> HTML document with an
		   <a href="https://example.com">inline link</a>.</p>
		<ul>
			<li>Item one</li>
			<li>Item two</li>
		</ul>
		<!-- A comment for the tokenizer to skip -->
		<script>
			console.log("Hello from Sample.html");
		</script>
	</main>
</body>
</html>
