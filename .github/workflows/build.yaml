name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    name: Build with scheme
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Install SwiftLint
        # Pinned to a release artifact rather than installed from Homebrew, which
        # tracks latest. `--strict` fails on warnings, so a SwiftLint release that adds
        # a default rule would fail pull requests that never touched the offending
        # code. AGENTS.md also tells contributors to run SwiftLint locally and expect
        # CI to agree, which only holds while both sides are the same version.
        # Bump this deliberately.
        env:
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -sSL --fail -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Check localized string usage
        run: ./scripts/check_localized_strings.sh
      - name: Lint
        run: |
          swiftlint version
          swiftlint --strict
      - name: Test editor package
        run: swift test --package-path MopedEditor
      - name: Build
        run: |
          xcodebuild -scheme Moped -derivedDataPath ./xcbuild build
          mv xcbuild/Build/Products/Debug/Moped.app .
          zip -r -9 Moped.zip Moped.app
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moped.zip
          path: Moped.zip
          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day. Maximum 90 days unless changed from the repository settings page.
          retention-days: 0
