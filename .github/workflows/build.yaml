name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

# Pushing again to the same branch or PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build with scheme
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        # Pinned for the same reason SwiftLint is: `macos-latest` rolls its default Xcode
        # forward without notice, which changes the compiler and SDK under a commit that
        # passed yesterday. Bump XCODE_APP deliberately, alongside the SwiftLint version.
        #
        # Falls back to the runner default rather than failing, because the exact app name
        # depends on the runner image. Check the annotation in the log and set XCODE_APP to
        # one of the listed paths to make the pin real; the versions are printed either way,
        # so a toolchain rollover is visible in the log instead of silent.
        env:
          XCODE_APP: /Applications/Xcode_26.app
        run: |
          if [ -d "$XCODE_APP" ]; then
            sudo xcode-select -switch "$XCODE_APP"
          else
            echo "::warning::$XCODE_APP not found; using the runner default Xcode."
            ls -d /Applications/Xcode*.app || true
          fi
          xcodebuild -version
          swift --version
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Install SwiftLint
        # Pinned to a release artifact rather than installed from Homebrew, which
        # tracks latest. `--strict` fails on warnings, so a SwiftLint release that adds
        # a default rule would fail pull requests that never touched the offending
        # code. AGENTS.md also tells contributors to run SwiftLint locally and expect
        # CI to agree, which only holds while both sides are the same version.
        # Bump this deliberately.
        env:
          SWIFTLINT_VERSION: 0.65.0
        run: |
          curl -sSL --fail -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Check localized string usage
        run: ./scripts/check_localized_strings.sh
      - name: Lint
        run: |
          swiftlint version
          swiftlint --strict
      - name: Test editor package
        run: swift test --package-path MopedEditor
      - name: Build
        run: |
          xcodebuild -scheme Moped -derivedDataPath ./xcbuild build
          mv xcbuild/Build/Products/Debug/Moped.app .
          zip -r -9 Moped-debug-build-check.zip Moped.app
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          # Deliberately not called Moped.zip: this is an unoptimised Debug build, ad-hoc
          # signed and not notarized, so it is a compile check and not something to hand to
          # a user. Release downloads are archived and notarized from Xcode by hand.
          name: Moped-debug-build-check.zip
          path: Moped-debug-build-check.zip
          # Duration after which the artifact expires, in days (1-90).
          retention-days: 14
