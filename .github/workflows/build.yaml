name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    name: Build with scheme
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools
        # Neither ships on the macos runner image: ripgrep for the localization
        # check, SwiftLint for the lint gate.
        run: brew install ripgrep swiftlint
      - name: Check localized string usage
        run: ./scripts/check_localized_strings.sh
      - name: Lint
        # --strict fails on warnings, which is what "SwiftLint must be clean" in
        # AGENTS.md means. Homebrew tracks latest, so a release that adds a rule can
        # fail a PR that did not touch the offending code — the version is printed to
        # make that obvious when it happens.
        run: |
          swiftlint version
          swiftlint --strict
      - name: Test editor package
        run: swift test --package-path MopedEditor
      - name: Build
        run: |
          xcodebuild -scheme Moped -derivedDataPath ./xcbuild build
          mv xcbuild/Build/Products/Debug/Moped.app .
          zip -r -9 Moped.zip Moped.app
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moped.zip
          path: Moped.zip
          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day. Maximum 90 days unless changed from the repository settings page.
          retention-days: 0
